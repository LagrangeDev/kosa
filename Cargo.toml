[workspace]
resolver = "3"
members = ["kosa", "kosa-macros", "kosa-proto"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
actix = "0.13.5"
ahash = "0.8.12"
anyhow = "1.0.100"
async-trait = "0.1.89"
bytes = "1.11.0"
chrono = "0.4.42"
futures = "0.3.31"
hex = "0.4.3"
prost = "0.14.1"
reqwest = "0.13.2"
serde = "1.0.228"
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-util = "0.7.17"
tracing = "0.1.44"
kosa = { version = "0.1.0", path = "kosa" }
kosa-macros = { version = "0.1.0", path = "kosa-macros" }
kosa-proto = { version = "0.1.0", path = "kosa-proto" }
